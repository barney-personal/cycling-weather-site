<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Destination · Cycling Weather</title>
  <meta name="description" content="14-day outlook, climatology, and signature routes for a single cycling destination.">
  <meta name="theme-color" content="#fafaf7" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0e1116" media="(prefers-color-scheme: dark)">
  <script>
    // FOUC prevention: resolve theme synchronously before first paint.
    // Mirror of theme-toggle.ts logic; do not edit one without the other.
    (function () {
      try {
        var stored = null;
        try { stored = localStorage.getItem("cw-theme"); } catch (_) {}
        var theme = (stored === "light" || stored === "dark")
          ? stored
          : (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
        document.documentElement.setAttribute("data-theme", theme);
      } catch (e) {
        document.documentElement.setAttribute("data-theme", "light");
      }
    })();
  </script>
</head>
